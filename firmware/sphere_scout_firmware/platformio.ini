; Sphere-Scout ESP32-S3 firmware (micro-ROS over Wi-Fi).
; Not part of the colcon build (see COLCON_IGNORE). Build with PlatformIO separately.

[env:sphere_scout]
platform = espressif32
; TODO: confirm ESP32-S3 Mini board ID
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
board_microros_distro = jazzy
board_microros_transport = wifi
